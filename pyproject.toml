[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luxe-solara-qualification"
version = "0.1.0"
description = "Luxe Solara qualification platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic-settings>=2.4", "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "jinja2>=3.1", "python-multipart>=0.0.9", "passlib[bcrypt]>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "docs*", "frontend*", "seeds*", "tests*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["E401", "E701", "E702"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
strict = true
